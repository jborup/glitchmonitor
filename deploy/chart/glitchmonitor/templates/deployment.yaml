apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchmonitor
  labels:
    {{- include "glitchmonitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  # One pod per node is required, so a surge pod could never be scheduled on a
  # 3-node cluster: roll by taking one pod down at a time instead.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "glitchmonitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "glitchmonitor.selectorLabels" . | nindent 8 }}
      annotations:
        # A config change rolls the pods.
        checksum/config: {{ include "glitchmonitor.config" . | sha256sum }}
    spec:
      serviceAccountName: glitchmonitor
      # Service-link variables (GLITCHMONITOR_PORT=tcp://...) would be read as config overrides.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "glitchmonitor.selectorLabels" . | nindent 18 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: glitchmonitor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- if ne .Values.image.pullPolicy "IfNotPresent" }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          args: [serve]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/glitchmonitor
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: glitchmonitor-config
