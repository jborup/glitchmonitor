{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: glitchmonitor
  labels:
    {{- include "glitchmonitor.labels" . | nindent 4 }}
  annotations:
    # No sticky-session cookie: every request must be free to land on any pod.
    haproxy.router.openshift.io/disable_cookies: "true"
spec:
  host: {{ include "glitchmonitor.routeHost" . }}
  to:
    kind: Service
    name: glitchmonitor
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
