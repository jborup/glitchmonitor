{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glitchmonitor
  labels:
    {{- include "glitchmonitor.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.gateway.name }}
      namespace: {{ .Values.httproute.gateway.namespace }}
  hostnames:
    - {{ include "glitchmonitor.httprouteHost" . }}
  rules:
    - backendRefs:
        - name: glitchmonitor
          port: 8080
{{- end }}
