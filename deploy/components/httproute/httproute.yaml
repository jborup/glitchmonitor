apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glitchmonitor
  labels:
    app.kubernetes.io/name: glitchmonitor
spec:
  # Gateway name and namespace, and the hostname: patch in the overlay.
  parentRefs:
    - name: GATEWAY_NAME
      namespace: GATEWAY_NAMESPACE
  hostnames:
    - glitchmonitor.gtw.CLUSTER_DOMAIN
  rules:
    - backendRefs:
        - name: glitchmonitor
          port: 8080
