# With one pod per node on 3 nodes, a drained pod stays Pending and this
# blocks a second drain until the first node is back.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: glitchmonitor
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: glitchmonitor
