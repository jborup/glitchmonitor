apiVersion: v1
kind: ServiceAccount
metadata:
  name: glitchmonitor
---
# Lets each pod tag its pod-direct probe results with "in endpoints: yes/no".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: glitchmonitor
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: glitchmonitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: glitchmonitor
subjects:
  - kind: ServiceAccount
    name: glitchmonitor
