# Base config: no external targets, so the SPA probes whichever origin it was
# loaded from. Overlays replace this file with the real hostnames.
external: []
corsAllowedOrigins: []
browser:
  intervalMs: 100
  timeoutMs: 2000
  slowMs: 500
  failThreshold: 3
  expectedReplicas: 3
  podWindowSec: 5
  retry: true
internal:
  intervalMs: 200
  timeoutMs: 1000
  slowMs: 200
  failThreshold: 3
  connectTimeoutMs: 500
  retry: true
  targets:
    service: { enabled: true, modes: [keepalive, fresh] }
    podDirect: { enabled: true, modes: [fresh] }
    apiserver: { enabled: true }
server:
  port: 8080
  shutdownDelay: 5s
