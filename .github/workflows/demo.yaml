# Publishes the saved-run view with the sample runs as a static demo on GitHub Pages.
#
# It only runs when started by hand. To use it: switch Pages on once (repository
# Settings, Pages, Source: GitHub Actions), then start this workflow from the
# Actions tab. To publish on every push to main, add a `push` trigger below.
name: demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the site
        run: make demo-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
